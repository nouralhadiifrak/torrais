<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demander un menu — TORRAIS EVENT</title>
  <meta name="description" content="Choisissez vos plats TORRAIS EVENT (pastillas, viandes, poisson, desserts, jus…) et envoyez votre liste sur WhatsApp.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Mulish:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/brand/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/img/brand/apple-touch-icon.png">
  <meta name="theme-color" content="#16130f">
  <link rel="stylesheet" href="assets/vendor/lenis.css">
  <link rel="stylesheet" href="assets/css/site.css">
  <script>
    // Transition entre pages : la page arrive derrière un voile sombre qui s'efface (voir transitions.js)
    try {
      var ptE = sessionStorage.getItem('pt_enter'), ptD = document.documentElement;
      var ptBack = ptE === 'back' && (JSON.parse(sessionStorage.getItem('pt_nav') || 'null') || {}).from === location.pathname;
      if ((ptE === 'card' || ptE === 'fade' || ptBack) && !(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches)) {
        ptD.classList.add('pt-enter');
        window.__ptArrive = true;
        // la photo qui voyage reste à l'écran dès le premier affichage de la nouvelle page (pas de clignement)
        var ptN = (ptE === 'card' || ptBack) && JSON.parse(sessionStorage.getItem('pt_nav') || 'null');
        if (ptN && ptN.hero) {
          ptD.classList.add('pt-card');
          ptD.style.setProperty('--pt-src', ptN.src ? 'url("' + ptN.src + '")' : 'none');
          ptD.style.setProperty('--pt-top', ptN.hero.top + 'px');
          ptD.style.setProperty('--pt-h', ptN.hero.height + 'px');
        }
        setTimeout(function () { ptD.classList.remove('pt-enter', 'pt-card'); }, 2500);
      }
    } catch (e) {}
  </script>
</head>
<body data-page="menu-order">

  <div id="siteHeader"></div>

  <main id="contenu">
    <section class="page-hero page-hero--compact">
      <div class="container page-hero__inner">
        <nav class="crumbs" aria-label="Fil d'Ariane"><a href="index.html">Accueil</a> <span>›</span> <a href="menus.html">Nos menus</a> <span>›</span> <span>Demander un menu</span></nav>
        <h1 class="page-hero__title">Demander un menu</h1>
        <p class="page-hero__lead">Seulement le repas : choisissez vos plats, indiquez la date et le nombre d'invités, puis envoyez votre liste sur WhatsApp.</p>
      </div>
    </section>

    <section class="section composer-section">
      <div class="container" id="menuOrder"></div>
    </section>
  </main>

  <div id="siteFooter"></div>

  <script src="assets/vendor/gsap.min.js"></script>
  <script src="assets/vendor/ScrollTrigger.min.js"></script>
  <script src="assets/vendor/lenis.min.js"></script>

  <script src="assets/js/transitions.js"></script>
  <script src="assets/js/menu-order.js"></script>
  <script src="assets/js/motion.js"></script>
</body>
</html>
