<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nos menus — TORRAIS EVENT, traiteur à Casablanca</title>
  <meta name="description" content="Les menus de TORRAIS EVENT, traiteur à Casablanca : pastilla, viande aux pruneaux, poulet rôti, méchoui, desserts et thé à la menthe.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Mulish:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/brand/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/img/brand/apple-touch-icon.png">
  <meta name="theme-color" content="#16130f">
  <link rel="stylesheet" href="assets/vendor/lenis.css">
  <link rel="stylesheet" href="assets/css/site.css">
  <script>
    // Transition entre pages : la page arrive derrière un voile sombre qui s'efface (voir transitions.js)
    try { if (sessionStorage.getItem('pt_enter') && !(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches)) { document.documentElement.classList.add('pt-enter'); setTimeout(function () { document.documentElement.classList.remove('pt-enter'); }, 2500); } } catch (e) {}
  </script>
</head>
<body data-page="menus">

  <div id="siteHeader"></div>

  <main id="contenu">
    <section class="page-hero page-hero--photo" id="pageHero">
      <div class="page-hero__bg" style="background-image:url('assets/img/salle.jpg')" aria-hidden="true"></div>
      <div class="container page-hero__inner">
        <nav class="crumbs" aria-label="Fil d'Ariane"><a href="index.html">Accueil</a> <span>›</span> <span>Nos menus</span></nav>
        <h1 class="page-hero__title">Nos menus</h1>
        <p class="page-hero__lead">Une cuisine marocaine généreuse, préparée maison pour chacun de vos invités.</p>
      </div>
    </section>

    <!-- LES 5 FAMILLES DU MENU -->
    <section class="section section--cream" id="familles">
      <div class="container">
        <div class="section-head">
          <p class="eyebrow">Notre carte</p>
          <h2 class="section-title">Cinq familles de saveurs</h2>
          <p class="section-sub">Composez votre menu en piochant dans chaque famille : nous l'adaptons au nombre de vos invités.</p>
        </div>
        <div class="occasions occasions--zigzag" id="menuCats"></div>
      </div>
    </section>

    <!-- LES PLATS DE CHAQUE FAMILLE, EN PHOTOS -->
    <section class="section" id="detail">
      <div class="container">
        <div id="carteList"></div>
        <p class="carte-cta"><a href="composer.html" class="btn btn--gold">Composer votre événement</a> <a href="index.html#devis" class="btn btn--outline">Demander un devis</a></p>
      </div>
    </section>
  </main>

  <div id="siteFooter"></div>

  <script src="assets/vendor/gsap.min.js"></script>
  <script src="assets/vendor/ScrollTrigger.min.js"></script>
  <script src="assets/vendor/lenis.min.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/site.js"></script>
  <script src="assets/js/transitions.js"></script>
  <script src="assets/js/motion.js"></script>
</body>
</html>
